[package]
name = "rosox"
version = "0.1.0"
edition = "2024"

[profile.dev]

[profile.release]
lto = true

[[bin]]
name = "rosox"
test = true
bench = false

[[test]]
name = "should_panic"
harness = false

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}" ]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-success-exit-code = 33         # (0x10 << 1) | 1
test-timeout = 300

[features]
default = ["qemu"]
qemu = []
bsp_rpi3 = []
bsp_rpi4 = []
